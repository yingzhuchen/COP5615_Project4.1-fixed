name: Erlang tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Erlang
        run: sudo apt-get update && sudo apt-get install -y erlang erlang-eunit
      - name: Run tests
        run: bash run.sh test
